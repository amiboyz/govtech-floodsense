services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: local_govtech_floodsense
      MYSQL_ROOT_PASSWORD: floodsense_local_only
    ports:
      - "3306:3306"
    volumes:
      - floodsense_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pfloodsense_local_only"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  floodsense_mysql:
