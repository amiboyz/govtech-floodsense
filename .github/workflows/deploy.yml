name: Deploy FloodSense to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build and Package Release
        run: npm run build

      - name: Check Hostinger FTP Secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.HOSTINGER_FTP_USER }}" ] || [ -z "${{ secrets.HOSTINGER_FTP_PASSWORD }}" ]; then
            echo "::warning::HOSTINGER_FTP_USER or HOSTINGER_FTP_PASSWORD secrets not configured yet. Build verified, skipping upload."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Hostinger via FTP/FTPS
        if: steps.check_secrets.outputs.configured == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST || 'hazapp.online' }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/web/
          server-dir: ./domains/floodsense.hazapp.online/public_html/
          dangerous-clean-slate: false
